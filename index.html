<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Memory Match — HTML/CSS/JS</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
<main class="container" role="main">

    <header>
        <h1>Memory Match</h1>

        <div class="controls">
            <div class="stat">Moves: <span id="moves">0</span></div>
            <div class="stat">Errors: <span id="errors">0</span></div> <!-- REQUIRED by script -->
            <div class="stat">Time: <span id="timer">00:00</span></div>
            <div class="stat">Best: <span id="best">—</span></div>
            <button id="play">Play</button>
            <button id="restart">Restart</button>
        </div>
    </header>

    <section class="board-wrap" aria-label="Memory board">
        <div id="board" class="board" role="grid" aria-live="polite"></div>

        <footer class="footer">
            <p class="small">Flip two matching cards to remove them. Good luck!</p>
            <div class="small" id="status"></div>
        </footer>
    </section>

</main>

<script src="script.js"></script>
</body>
</html>
